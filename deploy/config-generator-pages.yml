name: Deploy config generator to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config-generator/**"
      - ".github/workflows/config-generator-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: config-generator-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test configuration core
        working-directory: config-generator
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: config-generator
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
