<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器本地生成抖音自动续火花配置文件">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>火花配置台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M13 4.5 7 14h4l-1 5.5L16.5 9h-4L13 4.5Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#editorGrid">跳到配置内容</a>

  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>DOUYIN_CONFIG</h1>
        <p>配置好友、消息和发送参数</p>
      </div>
      <div class="toolbar" aria-label="配置操作">
        <button class="button button-outline" id="resetConfigButton" type="button">清空</button>
        <button class="button button-outline" id="importFileButton" type="button">导入配置</button>
        <span class="tooltip-wrap">
          <button class="button button-outline" id="importClipboardButton" type="button" aria-describedby="clipboardTooltip">剪切板获取</button>
          <span class="tooltip" id="clipboardTooltip" role="tooltip">需要提前复制配置</span>
        </span>
        <button class="button button-outline" id="cronButton" type="button">Cron</button>
        <button class="button button-primary complete-action" id="completeButton" type="button"><svg class="complete-action-icon" aria-hidden="true" width="18" height="18"><use href="#icon-check-filled"></use></svg><span>完成</span></button>
      </div>
    </header>

    <section class="import-panel" id="pasteImportPanel" hidden>
      <label for="importText">粘贴 JSON</label>
      <div class="import-row">
        <textarea id="importText" name="import-json" rows="4" autocomplete="off" spellcheck="false" placeholder="粘贴 config.json 内容…"></textarea>
        <button class="button button-primary" id="confirmImportButton" type="button">导入</button>
      </div>
      <p class="field-error" id="importError" role="alert"></p>
    </section>

    <div class="editor-grid" id="editorGrid">
      <section class="panel panel-contacts" aria-labelledby="contactsTitle">
        <div class="panel-header">
          <div>
            <h2 id="contactsTitle">好友</h2>
            <p id="friendCount">0 位好友</p>
          </div>
          <div class="segmented" role="group" aria-label="配置模式">
            <button class="segment is-active" type="button" data-switch-mode="basic" aria-pressed="true">共享</button>
            <button class="segment" type="button" data-switch-mode="advanced" aria-pressed="false">独立</button>
          </div>
        </div>

        <div class="add-row">
          <input id="friendNameInput" name="friend-name" type="text" autocomplete="off">
          <button class="button button-primary" id="addFriendButton" type="button">添加</button>
        </div>
        <div class="friend-list" id="friendList" aria-label="好友列表"></div>
      </section>

      <section class="panel panel-messages" aria-labelledby="messagesTitle">
        <div class="panel-header">
          <div>
            <h2 id="messagesTitle">消息</h2>
            <p id="messageCount">0 条消息</p>
          </div>
          <div class="tabs" role="tablist" aria-label="消息类型">
            <button class="tab is-active" id="textTab" type="button" role="tab" aria-selected="true" aria-controls="textComposer" data-compose="text">文字</button>
            <button class="tab" id="stickerTab" type="button" role="tab" aria-selected="false" aria-controls="stickerComposer" data-compose="sticker" tabindex="-1">表情</button>
            <button class="tab" id="randomTab" type="button" role="tab" aria-selected="false" aria-controls="randomComposer" data-compose="random" tabindex="-1">随机</button>
          </div>
        </div>

        <div class="compose-panel" id="textComposer" role="tabpanel" aria-labelledby="textTab">
          <label for="messageInput">消息内容</label>
          <div class="add-row">
            <input id="messageInput" name="message" type="text" autocomplete="off" placeholder="输入消息内容">
            <button class="button button-primary" id="addTextButton" type="button">添加</button>
          </div>
        </div>

        <div class="compose-panel" id="stickerComposer" role="tabpanel" aria-labelledby="stickerTab" hidden>
          <label>原生表情</label>
          <div class="sticker-grid" id="stickerGrid" aria-label="原生表情选项"></div>
        </div>

        <div class="compose-panel" id="randomComposer" role="tabpanel" aria-labelledby="randomTab" hidden>
          <label for="randomChoicesInput">候选消息</label>
          <textarea id="randomChoicesInput" name="random-choices" rows="4" autocomplete="off" placeholder="每行一条候选消息"></textarea>
          <button class="button button-primary" id="addRandomButton" type="button">添加随机消息</button>
        </div>

        <div class="message-list" id="messageList" aria-label="消息列表"></div>
      </section>

      <aside class="side-stack">
        <section class="panel panel-settings" aria-labelledby="settingsTitle">
          <div class="panel-header">
            <div>
              <h2 id="settingsTitle">高级设置</h2>
              <p>发送间隔与任务选项</p>
            </div>
          </div>

          <fieldset class="field-group interval-field">
            <legend>好友间发送间隔</legend>
            <div class="range-readout"><span id="intervalMinValue">3</span><span id="intervalMaxValue">8</span></div>
            <div class="range-slider" id="intervalSlider">
              <div class="range-track" aria-hidden="true"><span id="intervalRangeFill"></span></div>
              <input id="intervalMinInput" name="interval-min" type="range" min="0" max="10" step="0.5" value="3" aria-label="最短发送间隔">
              <input id="intervalMaxInput" name="interval-max" type="range" min="0" max="10" step="0.5" value="8" aria-label="最长发送间隔">
            </div>
          </fieldset>

          <div class="switch-list">
            <label class="switch-row"><span>失败后继续</span><input id="continueToggle" name="continue-on-error" type="checkbox"><i aria-hidden="true"></i></label>
            <label class="switch-row"><span>防止重复发送</span><input id="duplicateToggle" name="prevent-duplicates" type="checkbox"><i aria-hidden="true"></i></label>
          </div>

          <div class="settings-grid">
            <label>任务 ID<input id="taskIdInput" name="task-id" type="text" autocomplete="off" spellcheck="false"></label>
            <label>时区<input id="timezoneInput" name="timezone" type="text" autocomplete="off" spellcheck="false"></label>
            <label>重试次数<input id="retryInput" name="target-open-retries" type="number" inputmode="numeric" min="0" step="1" autocomplete="off"></label>
            <label>超时秒数<input id="timeoutInput" name="target-open-timeout" type="number" inputmode="decimal" min="0.1" step="0.5" autocomplete="off"></label>
          </div>
        </section>

        <section class="panel panel-status" aria-labelledby="statusTitle">
          <div class="panel-header">
            <div>
              <h2 id="statusTitle">检查</h2>
              <p id="generateHint" aria-live="polite"><svg aria-hidden="true" width="16" height="16"><use href="#icon-shield"></use></svg><span>配置有效</span></p>
            </div>
          </div>
          <div class="validation-list" id="validationList"></div>
          <p class="field-error" id="wizardError" role="alert" aria-live="polite"></p>
        </section>
      </aside>
    </div>
  </main>

  <input id="fileInput" name="config-file" type="file" accept="application/json,.json" aria-label="选择 JSON 配置文件" hidden>
  <div class="drop-overlay" id="dropOverlay" hidden><div><svg aria-hidden="true" width="28" height="28"><use href="#icon-upload"></use></svg><strong>释放文件以导入</strong></div></div>

  <dialog id="completeDialog" class="modal">
    <form method="dialog" class="modal-content modal-small">
      <header><h2>完成配置</h2><button class="icon-button" value="cancel" aria-label="关闭完成窗口"><svg aria-hidden="true" width="18" height="18"><use href="#icon-close"></use></svg></button></header>
      <div class="modal-actions">
        <button class="button button-outline" id="copyConfigButton" type="button"><svg aria-hidden="true" width="18" height="18"><use href="#icon-copy"></use></svg>复制</button>
        <button class="button button-primary" id="downloadConfigButton" type="button"><svg aria-hidden="true" width="18" height="18"><use href="#icon-download"></use></svg>下载</button>
      </div>
      <p class="dialog-note">使用GitHub Actions方案推荐下载 <code>config.json</code> 并妥善保管，方便以后编辑</p>
      <p class="field-error" id="completeError" role="alert"></p>
    </form>
  </dialog>

  <dialog id="clearDialog" class="modal">
    <form method="dialog" class="modal-content modal-small">
      <header><h2>清空配置</h2><button class="icon-button" value="cancel" aria-label="关闭清空确认窗口"><svg aria-hidden="true" width="18" height="18"><use href="#icon-close"></use></svg></button></header>
      <p class="dialog-note">确认清空当前页面中的好友、消息和参数？</p>
      <div class="modal-actions">
        <button class="button button-outline" value="cancel" type="submit">取消</button>
        <button class="button button-primary" id="confirmClearButton" type="button">清空</button>
      </div>
    </form>
  </dialog>

  <dialog id="cronDialog" class="modal">
    <form method="dialog" class="modal-content modal-small">
      <header><h2>Cron 生成器</h2><button class="icon-button" value="cancel" aria-label="关闭 Cron 生成器"><svg aria-hidden="true" width="18" height="18"><use href="#icon-close"></use></svg></button></header>
      <label>每日执行时间（UTC+8）<input id="cronTimeInput" name="cron-time" type="time" value="21:00"></label>
      <div class="cron-output" id="cronOutput" aria-live="polite"></div>
      <p class="field-error" id="cronWarning" role="alert" aria-live="polite"></p>
      <div class="modal-actions">
        <button class="button button-outline" id="copyCronButton" type="button"><svg aria-hidden="true" width="18" height="18"><use href="#icon-copy"></use></svg>复制</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <svg class="svg-defs" aria-hidden="true">
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 4.8 6v5.2c0 4.5 2.9 8.6 7.2 9.8 4.3-1.2 7.2-5.3 7.2-9.8V6L12 3Z"/><path d="m9.3 12 1.8 1.8 3.8-4"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 14v5h14v-5"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8-8-2Z"/><path d="m11 13 5-5"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3m2 0-1 14H8L7 7"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-loader" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
    <symbol id="icon-grip" viewBox="0 0 24 24"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"/></symbol>
    <symbol id="icon-check-filled" viewBox="0 0 256 256"><g fill="currentColor" stroke="none"><path d="m237.66 85.26l-128.4 128.4a8 8 0 0 1-11.32 0l-71.6-72a8 8 0 0 1 0-11.31l24-24a8 8 0 0 1 11.32 0L104 147.43l98.34-97.09a8 8 0 0 1 11.32 0l24 23.6a8 8 0 0 1 0 11.32" opacity=".2"/><path d="m243.28 68.24l-24-23.56a16 16 0 0 0-22.59 0L104 136.23l-36.69-35.6a16 16 0 0 0-22.58.05l-24 24a16 16 0 0 0 0 22.61l71.62 72a16 16 0 0 0 22.63 0L243.33 90.91a16 16 0 0 0-.05-22.67M103.62 208L32 136l24-24a.6.6 0 0 1 .08.08l42.35 41.09a8 8 0 0 0 11.19 0L208.06 56L232 79.6Z"/></g></symbol>
  </svg>
  <script type="module" src="app.js"></script>
</body>
</html>
